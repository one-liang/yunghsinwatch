     任何帶 data-booking-open 的元素都會開啟它（header 的「預約服務」CTA、首頁與精品店頁的
     「我要預約」橫幅），開關與驗證邏輯在 src/js/component/booking-modal.js。

     這支被巢狀放在 header.html 裡，所以每一頁都有，頁面本身不需要引用。

     設計稿（Figma node 539:1950 / 528:2216）沒有畫關閉（X）按鈕，所以只靠點面板外側或 Esc 關閉。
     欄位骨架、錯誤樣式與同意條款那一列刻意和 src/pages/contact.html 的聯絡表單完全一致，
     兩處要改請一起改。 -->

  <div class="booking-modal__scrim absolute inset-0 bg-black/40"></div>

       內容比螢幕高時則自然往下長，不會被 flex 置中切掉上緣。 -->
  <div class="booking-modal__scroll absolute inset-0 overflow-y-auto overscroll-contain">

        <div

        >

            class="type-label-eyebrow-lg tracking-[1.5px] text-brown-light uppercase"

            Booking

            <p class="type-heading-md tracking-[2px] lg:type-heading-xl" data-i18n="booking.title">
              填寫預約資料
            </p>
            <!-- 設計稿是 Playfair Regular 40/48；type-display-xl 是 500/50，字重與行高都不同，
                 與其層層覆寫不如直接寫級數（比照 contact.html 的「訊息已送出」標題）。
                 LG 以下設計稿未定義，沿用中文主標的 28/40。 -->

              class="font-display text-[28px] leading-10 font-normal lg:text-[40px] lg:leading-12"
              data-i18n="booking.subtitle"
            >
              Schedule an Appointment

                    d="M3.52639 3.6867C4.53388 2.60582 5.9691 2.0002 7.6654 2.0002H16.3344C18.0347 2.0002 19.4705 2.6055 20.4775 3.68698C21.4789 4.76242 22.0004 6.2478 22.0004 7.9162V16.0842C22.0004 17.7526 21.4789 19.238 20.4774 20.3135C19.4702 21.3949 18.0341 22.0002 16.3334 22.0002H7.6654C5.96509 22.0002 4.52946 21.3949 3.52268 20.3133C2.52155 19.2379 2.0004 17.7525 2.0004 16.0842V7.9162C2.0004 6.24697 2.52436 4.76172 3.52639 3.6867Z"
                    fill="#463527"
                  />
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M17.0303 8.46967C17.3232 8.76256 17.3232 9.23744 17.0303 9.53033L11.1978 15.3628C10.905 15.6557 10.4302 15.6557 10.1373 15.363L7.21978 12.4467C6.92683 12.1539 6.92673 11.679 7.21956 11.386C7.51239 11.0931 7.98726 11.093 8.28022 11.3858L10.6674 13.772L15.9697 8.46967C16.2626 8.17678 16.7374 8.17678 17.0303 8.46967Z"
                    fill="white"
                  />
                </svg>
                <span
                  class="min-w-0 flex-1 type-body-base tracking-[1px] text-brown-warm en:font-label"
                >
                  <span data-i18n="booking.consent.before">我同意依據</span>
                  <a
                    class="text-brown-dark underline transition-opacity duration-200 hover:opacity-70"
                    href="./privacy.html"
                    data-i18n="booking.consent.link"
                    >隱私政策</a
                  >
                  <span data-i18n="booking.consent.after"
                    >收集與處理我的個人資料，以便回覆此詢問。</span
                  >
                </span>
              </label>
              <p
                class="flex items-center gap-1.5 type-body-sm text-error-warm en:font-label"
                hidden
                data-booking-error
              >
                <img class="size-5 shrink-0" src="@assets/images/icon-danger.svg" alt="" />
                <span data-i18n="booking.consent.error">請先同意隱私政策</span>
              </p>
            </div>

            <div class="flex justify-end">
              <!-- 設計稿這顆按鈕寫的是「確認送出」，但它實際的行為是前往 step2，所以文案定為「下一步」。 -->
              <button
                class="w-full cursor-pointer border border-brown-dark bg-brown-dark px-4 py-3 text-center type-body-sm text-white transition-opacity duration-200 hover:opacity-90 lg:w-[200px] en:font-label"
                type="submit"
                data-i18n="booking.next"
              >
                下一步
              </button>
            </div>
          </form>

          <!-- ---------- Step 2：聯絡資料 ---------- -->
          <div class="flex flex-col gap-6 lg:gap-8" hidden data-booking-step="2">
            <div class="flex flex-col bg-background px-4 py-4 lg:px-8">
              <div class="flex gap-3 py-2">
                <p
                  class="w-24 shrink-0 type-body-base tracking-[1px] text-brown-warm en:font-label"
                  data-i18n="booking.field.service.label"
                >
                  服務項目
                </p>
                <p
                  class="min-w-0 flex-1 type-body-base tracking-[1px] en:font-label"
                  data-booking-summary="service"
                ></p>
              </div>
              <div class="flex gap-3 py-2">
                <p
                  class="w-24 shrink-0 type-body-base tracking-[1px] text-brown-warm en:font-label"
                  data-i18n="booking.field.store.label"
                >
                  門市分店
                </p>
                <p
                  class="min-w-0 flex-1 type-body-base tracking-[1px] en:font-label"
                  data-booking-summary="store"
                ></p>
              </div>
              <div class="flex gap-3 py-2">
                <p
                  class="w-24 shrink-0 type-body-base tracking-[1px] text-brown-warm en:font-label"
                  data-i18n="booking.field.staff.label"
                >
                  服務人員
                </p>
                <p
                  class="min-w-0 flex-1 type-body-base tracking-[1px] en:font-label"
                  data-booking-summary="staff"
                ></p>
              </div>
              <div class="flex gap-3 py-2">
                <p
                  class="w-24 shrink-0 type-body-base tracking-[1px] text-brown-warm en:font-label"
                  data-i18n="booking.field.date.label"
                >
                  預約日期
                </p>
                <!-- 日期與時間在設計稿是 Inter + 2px 字距，所以這兩列不套 type-body-base。 -->
                <p
                  class="min-w-0 flex-1 font-label text-base leading-7 tracking-[2px]"
                  data-booking-summary="date"
                ></p>
              </div>
              <div class="flex gap-3 py-2">
                <p
                  class="w-24 shrink-0 type-body-base tracking-[1px] text-brown-warm en:font-label"
                  data-i18n="booking.field.time.label"
                >
                  預約時間
                </p>
                <p
                  class="min-w-0 flex-1 font-label text-base leading-7 tracking-[2px]"
                  data-booking-summary="time"
                ></p>
              </div>
            </div>

            <div class="border-t border-brown-dark/16"></div>

            <form class="flex flex-col gap-8" novalidate data-booking-form="2">
              <div class="flex flex-col gap-8 lg:grid lg:grid-cols-3">
                <div class="flex flex-col gap-1">
                  <label
                    class="type-body-base-medium tracking-[1px] text-brown-dark en:font-label"
                    for="booking-salutation"
                    data-i18n="booking.field.salutation.label"
                  >
                    稱謂
                  </label>
                  <div class="relative">
                    <select
                      class="w-full appearance-none border border-brown-dark/32 bg-background py-3 pr-9 pl-4 type-body-base tracking-[1px] text-black data-invalid:border-error-warm data-invalid:bg-error-light en:font-label"
                      id="booking-salutation"
                      name="salutation"
                      required
                      data-booking-field
                    >
                      <option value="" data-i18n="booking.field.selectPlaceholder">請選擇</option>
                      <option value="mr" data-i18n="booking.field.salutation.mr">先生</option>
                      <option value="ms" data-i18n="booking.field.salutation.ms">女士</option>
                    </select>
                    <svg
                      class="pointer-events-none absolute top-1/2 right-4 size-5 -translate-y-1/2"
                      viewBox="0 0 20 20"
                      fill="none"
                      aria-hidden="true"
                    >
                      <path
                        d="M5.34171 9.16667H14.6584C14.8232 9.16736 14.9841 9.2169 15.1207 9.30904C15.2574 9.40117 15.3637 9.53176 15.4261 9.68429C15.4885 9.83682 15.5043 10.0044 15.4715 10.1659C15.4387 10.3275 15.3587 10.4756 15.2417 10.5917L10.5917 15.2417C10.5142 15.3198 10.4221 15.3818 10.3205 15.4241C10.219 15.4664 10.1101 15.4882 10 15.4882C9.89003 15.4882 9.78111 15.4664 9.67956 15.4241C9.57801 15.3818 9.48585 15.3198 9.40838 15.2417L4.75838 10.5917C4.64136 10.4756 4.56138 10.3275 4.52856 10.1659C4.49574 10.0044 4.51155 9.83682 4.57399 9.68429C4.63643 9.53176 4.74269 9.40117 4.87934 9.30904C5.016 9.2169 5.1769 9.16736 5.34171 9.16667V9.16667Z"
                        fill="currentColor"
                      />
                    </svg>
                  </div>
                  <p
                    class="flex items-center gap-1.5 type-body-sm text-error-warm en:font-label"
                    hidden
                    data-booking-error
                  >
                    <img class="size-5 shrink-0" src="@assets/images/icon-danger.svg" alt="" />
                    <span data-i18n="booking.field.salutation.error">請選擇稱謂</span>
                  </p>
                </div>

                <div class="flex flex-col gap-1">
                  <label
                    class="type-body-base-medium tracking-[1px] text-brown-dark en:font-label"
                    for="booking-last-name"
                    data-i18n="booking.field.lastName.label"
                  >
                    姓氏
                  </label>
                  <input
                    class="w-full border border-brown-dark/32 bg-background px-4 py-3 type-body-base tracking-[1px] text-black placeholder:text-[#ababab] data-invalid:border-error-warm data-invalid:bg-error-light en:font-label"
                    id="booking-last-name"
                    name="lastName"
                    type="text"
                    placeholder="請輸入姓氏"
                    data-i18n-attr="placeholder:booking.field.lastName.placeholder"
                    required
                    data-booking-field
                  />
                  <p
                    class="flex items-center gap-1.5 type-body-sm text-error-warm en:font-label"
                    hidden
                    data-booking-error
                  >
                    <img class="size-5 shrink-0" src="@assets/images/icon-danger.svg" alt="" />
                    <span data-i18n="booking.field.lastName.error">請輸入姓氏</span>
                  </p>
                </div>

                <div class="flex flex-col gap-1">
                  <label
                    class="type-body-base-medium tracking-[1px] text-brown-dark en:font-label"
                    for="booking-first-name"
                    data-i18n="booking.field.firstName.label"
                  >
                    名字
                  </label>
                  <input
                    class="w-full border border-brown-dark/32 bg-background px-4 py-3 type-body-base tracking-[1px] text-black placeholder:text-[#ababab] data-invalid:border-error-warm data-invalid:bg-error-light en:font-label"
                    id="booking-first-name"
                    name="firstName"
                    type="text"
                    placeholder="請輸入名字"
                    data-i18n-attr="placeholder:booking.field.firstName.placeholder"
                    required
                    data-booking-field
                  />
                  <p
                    class="flex items-center gap-1.5 type-body-sm text-error-warm en:font-label"
                    hidden
                    data-booking-error
                  >
                    <img class="size-5 shrink-0" src="@assets/images/icon-danger.svg" alt="" />
                    <span data-i18n="booking.field.firstName.error">請輸入名字</span>
                  </p>
                </div>
              </div>

              <div class="flex flex-col gap-1">
                <label
                  class="type-body-base-medium tracking-[1px] text-brown-dark en:font-label"
                  for="booking-email"
                  data-i18n="booking.field.email.label"
                >
                  電子郵件
                </label>
                <input
                  class="w-full border border-brown-dark/32 bg-background px-4 py-3 type-body-base tracking-[1px] text-black placeholder:text-[#ababab] data-invalid:border-error-warm data-invalid:bg-error-light en:font-label"
                  id="booking-email"
                  name="email"
                  type="email"
                  placeholder="請輸入電子郵件"
                  data-i18n-attr="placeholder:booking.field.email.placeholder"
                  required
                  data-booking-field
                />
                <p
                  class="flex items-center gap-1.5 type-body-sm text-error-warm en:font-label"
                  hidden
                  data-booking-error
                >
                  <img class="size-5 shrink-0" src="@assets/images/icon-danger.svg" alt="" />
                  <span data-i18n="booking.field.email.error">請輸入電子郵件</span>
                </p>
              </div>

              <div class="flex flex-col gap-1">
                <label
                  class="type-body-base-medium tracking-[1px] text-brown-dark en:font-label"
                  for="booking-phone"
                  data-i18n="booking.field.phone.label"
                >
                  聯絡電話
                </label>
                <div class="flex items-start gap-4 lg:gap-8">
                  <div class="relative w-36 shrink-0">
                    <!-- 國碼選單設計稿只畫出 +886，先維持單一選項（與聯絡我們頁一致）。 -->
                    <select
                      class="w-full appearance-none border border-brown-dark/32 bg-background py-3 pr-10 pl-4 font-label text-base leading-7 tracking-[2px] text-black"
                      name="countryCode"
                      aria-label="國碼"
                      data-i18n-attr="aria-label:booking.field.phone.countryLabel"
                    >
                      <option value="+886">TW +886</option>
                    </select>
                    <svg
                      class="pointer-events-none absolute top-1/2 right-4 size-6 -translate-y-1/2"
                      viewBox="0 0 24 24"
                      fill="none"
                      aria-hidden="true"
                    >
                      <path
                        d="M6.41005 11H17.5901C17.7878 11.0008 17.9809 11.0603 18.1449 11.1708C18.3089 11.2814 18.4364 11.4381 18.5113 11.6211C18.5862 11.8042 18.6052 12.0053 18.5658 12.1991C18.5264 12.3929 18.4305 12.5707 18.2901 12.71L12.7101 18.29C12.6171 18.3837 12.5065 18.4581 12.3846 18.5089C12.2628 18.5596 12.1321 18.5858 12.0001 18.5858C11.868 18.5858 11.7373 18.5596 11.6155 18.5089C11.4936 18.4581 11.383 18.3837 11.2901 18.29L5.71005 12.71C5.56963 12.5707 5.47366 12.3929 5.43428 12.1991C5.39489 12.0053 5.41386 11.8042 5.48879 11.6211C5.56371 11.4381 5.69123 11.2814 5.85521 11.1708C6.01919 11.0603 6.21228 11.0008 6.41005 11V11Z"
                        fill="currentColor"
                      />
                    </svg>
                  </div>
                  <div class="flex min-w-0 flex-1 flex-col gap-1">
                    <input
                      class="w-full border border-brown-dark/32 bg-background px-4 py-3 type-body-base tracking-[1px] text-black placeholder:text-[#ababab] data-invalid:border-error-warm data-invalid:bg-error-light en:font-label"
                      id="booking-phone"
                      name="phone"
                      type="tel"
                      placeholder="請輸入聯絡電話"
                      data-i18n-attr="placeholder:booking.field.phone.placeholder"
                      required
                      data-booking-field
                    />
                    <p
                      class="flex items-center gap-1.5 type-body-sm text-error-warm en:font-label"
                      hidden
                      data-booking-error
                    >
                      <img class="size-5 shrink-0" src="@assets/images/icon-danger.svg" alt="" />
                      <span data-i18n="booking.field.phone.error">請輸入聯絡電話</span>
                    </p>
                  </div>
                </div>
              </div>

              <div class="flex flex-col gap-1">
                <label
                  class="type-body-base-medium tracking-[1px] text-brown-dark en:font-label"
                  for="booking-message"
                  data-i18n="booking.field.message.label"
                >
                  留言內容
                </label>
                <textarea
                  class="h-32 w-full resize-none border border-brown-dark/32 bg-background px-4 py-3 type-body-base tracking-[1px] text-black placeholder:text-[#ababab] data-invalid:border-error-warm data-invalid:bg-error-light en:font-label"
                  id="booking-message"
                  name="message"
                  placeholder="請輸入留言內容"
                  data-i18n-attr="placeholder:booking.field.message.placeholder"
                  required
                  data-booking-field
                ></textarea>
                <p
                  class="flex items-center gap-1.5 type-body-sm text-error-warm en:font-label"
                  hidden
                  data-booking-error
                >
                  <img class="size-5 shrink-0" src="@assets/images/icon-danger.svg" alt="" />
                  <span data-i18n="booking.field.message.error">請輸入留言內容</span>
                </p>
              </div>

              <div class="flex items-center justify-between gap-4">
                <button
                  class="flex cursor-pointer items-center gap-1 py-3 type-body-sm text-brown-dark transition-opacity duration-200 hover:opacity-70 en:font-label"
                  type="button"
                  data-booking-back
                >
                  <span data-i18n="booking.back">返回</span>
                  <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M10.25 19.5L17.75 12L10.25 4.5"
                      stroke="currentColor"
                      stroke-width="1.72"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
                <button
                  class="w-40 cursor-pointer border border-brown-dark bg-brown-dark px-4 py-3 text-center type-body-sm text-white transition-opacity duration-200 hover:opacity-90 lg:w-[200px] en:font-label"
                  type="submit"
                  data-i18n="booking.submit"
                >
                  確認送出
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
