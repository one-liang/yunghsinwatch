<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="認識百達翡麗 GOLDEN ELLIPSE 5204G-010 腕錶，橄欖綠色放射狀錶面搭配白金錶殼，展現經典橢圓造型的和諧比例。"
      data-i18n-attr="content:model.meta.description"
    />
    <link rel="icon" href="../assets/images/home/patek-philippe-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/vendor/swiper/swiper-bundle.min.css" />
    <title data-i18n="model.meta.title">
      GOLDEN ELLIPSE 5204G-010 腕錶｜永新鐘錶百達翡麗專賣店
    </title>
    <link rel="stylesheet" href="../assets/vendor/lenis/lenis.css" />
  </head>
  <body class="model-page min-h-screen overflow-x-clip bg-white type-body-base text-black">
    <c-header />

    <main>
      <section class="model-top">
        <div class="model-gallery" data-reveal-media>
          <div class="swiper model-gallery__main">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <img src="../assets/images/collection/model/front.png" alt="" />
              </div>
              <div class="swiper-slide">
                <img src="../assets/images/collection/model/side.png" alt="" />
              </div>
              <div class="swiper-slide">
                <img src="../assets/images/collection/model/side-crown.png" alt="" />
              </div>
              <div class="swiper-slide">
                <img src="../assets/images/collection/model/caseback.png" alt="" />
              </div>
            </div>
          </div>

          <div class="model-gallery__thumbs-wrap">
            <div class="swiper model-gallery__thumbs">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <img src="../assets/images/collection/model/front.png" alt="" />
                </div>
                <div class="swiper-slide">
                  <img src="../assets/images/collection/model/side.png" alt="" />
                </div>
                <div class="swiper-slide">
                  <img src="../assets/images/collection/model/side-crown.png" alt="" />
                </div>
                <div class="swiper-slide">
                  <img src="../assets/images/collection/model/caseback.png" alt="" />
                </div>
              </div>
            </div>
            <button
              class="model-gallery__nav model-gallery__nav--prev"
              type="button"
              data-i18n-attr="aria-label:model.gallery.prev"
              aria-label="上一張"
            >
              <img src="../assets/icons/arrow-left.svg" alt="" />
            </button>
            <button
              class="model-gallery__nav model-gallery__nav--next"
              type="button"
              data-i18n-attr="aria-label:model.gallery.next"
              aria-label="下一張"
            >
              <img src="../assets/icons/arrow-right.svg" alt="" />
            </button>
          </div>
        </div>

        <c-model-detail />
      </section>

      <c-model-recommend />
    </main>

    <c-footer />

    <script src="../assets/vendor/swiper/swiper-bundle.min.js"></script>
    <c-motion-scripts />

</html>
