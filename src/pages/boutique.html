<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="走進永新鐘錶百達翡麗專賣店，感受稀缺工藝與精準美學交織的空間，並查詢台北地區的官方銷售點。"
      data-i18n-attr="content:boutique.meta.description"
    />
    <link rel="icon" href="../assets/images/home/patek-philippe-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/vendor/swiper/swiper-bundle.min.css" />
    <title data-i18n="boutique.meta.title">品牌專賣店｜永新鐘錶百達翡麗專賣店</title>
  </head>
  <body class="boutique-page min-h-screen bg-white type-body-base text-black">
    <c-header />

    <main>
      <section class="relative h-[250px] overflow-hidden text-white xl:h-[375px]">
        <img
          class="absolute inset-0 size-full object-cover"
          src="../assets/images/boutique/hero.jpg"
          alt=""
        />
        <div class="absolute inset-0 bg-black/48"></div>
        <div
          class="absolute right-5 bottom-6 left-5 flex flex-col items-center gap-2 text-center xl:right-16 xl:bottom-12 xl:left-16 xl:gap-4"
        >
          <p
            class="font-label text-sm leading-[22px] font-medium tracking-[1.5px] text-background uppercase lg:text-base lg:leading-6"
            data-i18n="boutique.hero.eyebrow"
          >
            Boutique
          </p>
          <h1
            class="type-heading-md tracking-[2px] xl:type-heading-xl"
            data-i18n="boutique.hero.title"
          >
            永新鐘錶百達翡麗專賣店
          </h1>
        </div>
      </section>

      <section
        class="mx-auto flex max-w-[768px] flex-col items-center gap-4 px-5 py-12 text-center xl:px-0 xl:py-20"
      >
        <h2
          class="pt-2 font-heading text-[22px] leading-9 font-medium tracking-[1px] text-brown-dark lg:type-heading-sm xl:type-heading-lg"
          data-i18n="boutique.intro.title"
        >
          聚光燈下的鐘錶城堡
        </h2>
        <p
          class="pt-2 font-heading text-[18px] leading-8 font-medium tracking-[1px] text-brown-dark xl:text-xl"
          data-i18n="boutique.intro.body"
        >
          以「稀缺工藝」與「精準美學」，永新百達翡麗專館透過傳承與創新，訴說時間的璀璨永恆。
        </p>
      </section>

      <!-- 圖片輪播：slide 比容器窄且置中，容器不裁切，左右自然露出相鄰的圖。
           非 loop，到頭／尾時對應的箭頭停用；LG 以下不顯示箭頭，改用滑動。 -->
      <section class="boutique-carousel relative h-[250px] lg:h-[432px] xl:h-[534px] 2xl:h-[675px]">
        <div class="boutique-carousel__viewport swiper h-full">
          <div class="swiper-wrapper">
            <article class="swiper-slide">
              <img src="../assets/images/boutique/slide-1.jpg" alt="" />
            </article>
            <article class="swiper-slide">
              <img src="../assets/images/boutique/slide-2.jpg" alt="" />
            </article>
          </div>
        </div>

        <button
          class="boutique-carousel__nav boutique-carousel__nav--prev hidden cursor-pointer rounded-full bg-white/80 p-[10px] transition-opacity duration-200 lg:block"
          type="button"
          data-carousel-prev
          data-i18n-attr="aria-label:boutique.carousel.prev"
          aria-label="上一張"
        >
          <img class="size-6 rotate-180" src="@assets/icons/arrow-right.svg" alt="" />
        </button>
        <button
          class="boutique-carousel__nav boutique-carousel__nav--next hidden cursor-pointer rounded-full bg-white/80 p-[10px] transition-opacity duration-200 lg:block"
          type="button"
          data-carousel-next
          data-i18n-attr="aria-label:boutique.carousel.next"
          aria-label="下一張"
        >
          <img class="size-6" src="@assets/icons/arrow-right.svg" alt="" />
        </button>
      </section>

      <section
        class="mx-auto flex max-w-[768px] flex-col items-center gap-4 px-5 py-12 text-center xl:px-0 xl:py-20"
      >
        <img class="size-8" src="@assets/images/home/patek-philippe-mark.svg" alt="" />
        <!-- 設計稿在 LG 以上是四句各一行，MD 以下把後兩句合成一段讓它自然折行。
             i18n runtime 只改 textContent（<br> 會被吃掉），所以改用兩份文案切換。 -->
        <p
          class="pt-2 font-heading text-[18px] leading-8 font-medium tracking-[1px] whitespace-pre-line text-brown-dark lg:hidden"
          data-i18n="boutique.story.bodySm"
        >
          在時間的長河中，鐘錶不僅是計時工具， 更是藝術、工藝與情感的載體。
          永新鐘錶以深厚的技藝底蘊與誠信的經營哲學，成為無數愛錶人士心中的殿堂。
        </p>
        <p
          class="hidden pt-2 font-heading text-[18px] leading-8 font-medium tracking-[1px] whitespace-pre-line text-brown-dark lg:block xl:text-xl"
          data-i18n="boutique.story.body"
        >
          在時間的長河中，鐘錶不僅是計時工具， 更是藝術、工藝與情感的載體。
          永新鐘錶以深厚的技藝底蘊與誠信的經營哲學， 成為無數愛錶人士心中的殿堂。
        </p>
      </section>

      <c-store-locator />

      <section
        class="flex items-center justify-center bg-brown-dark px-5 py-10 text-white lg:h-[175px] lg:py-0 xl:h-[200px]"
      >
        <a
          class="flex flex-col items-center gap-4 text-center transition-opacity duration-200 hover:opacity-80 lg:flex-row lg:gap-14"
          href="#"
        >
          <span
            class="type-heading-md tracking-[2px] whitespace-nowrap lg:type-heading-lg xl:type-heading-xl"
            data-i18n="boutique.appointment.title"
          >
            我要預約
          </span>
          <span class="h-6 w-px shrink-0 bg-white/60"></span>
          <span
            class="type-label-eyebrow-lg tracking-[1.5px] uppercase"
            data-i18n="boutique.appointment.subtitle"
          >
            Schedule an Appointment
          </span>
        </a>
      </section>
    </main>

    <c-footer />

    <script src="../assets/vendor/swiper/swiper-bundle.min.js"></script>
  </body>
</html>
